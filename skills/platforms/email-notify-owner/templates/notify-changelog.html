<!--
模板：小艾通知邮件 — Apple 风格（v3.0.0）
风格：仿 Apple 官方邮件/产品页视觉语言
核心规则：
  - 纯白底 + 极大留白 + 圆角卡片
  - 渐变色标题（蓝→紫）+ 大号加粗
  - 细体描述文字，PingFang SC / -apple-system 为主
  - 数据表格无框，灰底标签 + 深色值
  - 状态行：圆角胶囊，渐变绿/红/黄
  - 代码块：极浅灰底，等宽字体，无边框
  - 页脚：居中灰色小字，无装饰线
  - 全文 emoji ≤ 0
变量占位符（发送前替换）：
  __SUBJECT_TAIL__   主题尾部
  __TIMESTAMP__      时间戳
  __LOG_TYPE__       动作类型
  __TITLE__          中文大标题
  __ONELINE_DESC__   一行说明
  __DIFF_ROWS__      变更列表
  __META_ROWS__      元数据行
  __STATUS_LABEL__   OK / FAIL / PARTIAL
  __STATUS_BG__ / __STATUS_FG__  状态配色
  __EXIT_CODE__
  __DURATION__
  __ROLLBACK_CMD__
  __LOG_NUM__
-->
<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#f5f5f7;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f5f5f7;">
<tr><td align="center" style="padding:48px 20px;">

<table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.06);">

  <!-- 顶部渐变条 -->
  <tr><td style="height:3px;background:#0071e3;"></td></tr>

  <!-- 头部 -->
  <tr><td style="padding:36px 36px 0;">
    <div style="font-family:-apple-system,'PingFang SC','SF Pro Display','Helvetica Neue',sans-serif;font-size:13px;color:#86868b;letter-spacing:0.02em;margin-bottom:4px;">
      __TIMESTAMP__
    </div>
    <div style="font-family:-apple-system,'PingFang SC','SF Pro Display','Helvetica Neue',sans-serif;font-size:28px;font-weight:700;color:#1d1d1f;line-height:1.3;margin-bottom:12px;">
      __TITLE__
    </div>
    <div style="font-family:-apple-system,'PingFang SC','SF Pro Text','Helvetica Neue',sans-serif;font-size:15px;color:#6e6e73;line-height:1.6;margin-bottom:8px;">
      __ONELINE_DESC__
    </div>
    <div style="display:inline-block;font-family:-apple-system,'PingFang SC',sans-serif;font-size:11px;font-weight:600;color:#0071e3;background:rgba(0,113,227,0.08);padding:4px 12px;border-radius:20px;letter-spacing:0.03em;margin-bottom:28px;">
      __LOG_TYPE__
    </div>
  </td></tr>

  <!-- 变更列表 -->
  <tr><td style="padding:20px 36px 0;">
    <div style="font-family:-apple-system,'PingFang SC',sans-serif;font-size:12px;font-weight:600;color:#86868b;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;">
      Changes
    </div>
    <div style="background:#f5f5f7;border-radius:12px;padding:16px 20px;font-family:'SF Mono','Menlo','PingFang SC',monospace;font-size:13px;line-height:2;color:#1d1d1f;">
__DIFF_ROWS__
    </div>
  </td></tr>

  <!-- 元数据 -->
  <tr><td style="padding:24px 36px 0;">
    <div style="font-family:-apple-system,'PingFang SC',sans-serif;font-size:12px;font-weight:600;color:#86868b;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;">
      Details
    </div>
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="font-family:-apple-system,'PingFang SC','SF Pro Text',sans-serif;font-size:14px;line-height:2;">
__META_ROWS__
    </table>
  </td></tr>

  <!-- 状态胶囊 -->
  <tr><td style="padding:24px 36px 0;">
    <span style="display:inline-block;font-family:-apple-system,'PingFang SC',sans-serif;font-size:12px;font-weight:600;background:__STATUS_BG__;color:__STATUS_FG__;padding:6px 16px;border-radius:20px;letter-spacing:0.03em;">
      __STATUS_LABEL__
    </span>
    &nbsp;
    <span style="display:inline-block;font-family:'SF Mono','Menlo',monospace;font-size:12px;background:#f5f5f7;color:#6e6e73;padding:6px 14px;border-radius:20px;">
      exit __EXIT_CODE__
    </span>
    &nbsp;
    <span style="display:inline-block;font-family:'SF Mono','Menlo',monospace;font-size:12px;background:#f5f5f7;color:#6e6e73;padding:6px 14px;border-radius:20px;">
      __DURATION__
    </span>
  </td></tr>

  <!-- 回滚命令 -->
  <tr><td style="padding:24px 36px 0;">
    <div style="font-family:-apple-system,'PingFang SC',sans-serif;font-size:12px;font-weight:600;color:#86868b;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;">
      Rollback
    </div>
    <div style="background:#1d1d1f;color:#f5f5f7;font-family:'SF Mono','Menlo','PingFang SC',monospace;font-size:12px;line-height:1.8;padding:16px 20px;border-radius:12px;overflow-x:auto;">
__ROLLBACK_CMD__
    </div>
  </td></tr>

  <!-- 页脚 -->
  <tr><td style="padding:32px 36px 28px;text-align:center;">
    <div style="font-family:-apple-system,'PingFang SC',sans-serif;font-size:12px;color:#86868b;line-height:1.6;">
      xiaoai &middot; 101.32.98.240 &middot; sent via himalaya
    </div>
    <div style="font-family:'SF Mono','Menlo',monospace;font-size:11px;color:#d2d2d7;margin-top:4px;">
      /log #__LOG_NUM__
    </div>
  </td></tr>

</table>

</td></tr>
</table>
</body>
</html>
